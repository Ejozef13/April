name: april-search
services:
  searxng:
    # Official image, digest verified during the cloud pull. No mutable latest tag.
    image: docker.io/searxng/searxng@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
    user: "${APRIL_SEARCH_UID:?Run scripts/searxng.sh up}:${APRIL_SEARCH_GID:?Run scripts/searxng.sh up}"
    ports:
      - "127.0.0.1:${APRIL_SEARCH_PORT:-8888}:8080"
    environment:
      GRANIAN_HOST: "0.0.0.0"
      GRANIAN_PORT: "8080"
      GRANIAN_WORKERS: "1"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ../../artifacts/searxng/config:/etc/searxng
      - ../../artifacts/searxng/cache:/var/cache/searxng
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8080,timeout=3); c.request('GET','/healthz'); assert c.getresponse().status==200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
