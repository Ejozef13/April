# Copy to april.local.toml (ignored). Paths are relative to the project directory.
mode = "live" # Use "simulation" for the explicitly labeled UI fixture.
host = "127.0.0.1"
port = 8765
ollama_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b" # Suggested starting point; inspect existing models first.
whisper_cli = "whisper-cli"
stt_model = "models/ggml-base.en.bin"
piper_cli = "piper"
voice = "models/en_US-lessac-medium.onnx" # Adjacent .onnx.json also required.
timeout_seconds = 90
playback_timeout_seconds = 60
max_record_seconds = 15
max_response_chars = 600
max_response_tokens = 120
context_tokens = 2048
reasoning_effort = "default" # GPT-OSS supports low/medium/high; see desktop profile.
display_width = 640
display_height = 480
input_device_id = "default" # Browser device IDs; refresh device list after permission.
output_device_id = "default"
timezone = "America/New_York"

web_provider = "searxng"
searxng_url = "http://127.0.0.1:8888"

# Ordinary live requests search the web; false keeps manual search controls.
automatic_web_search = true

# Private, editable Markdown memory; Obsidian is optional. See docs/MEMORY.md.
memory_enabled = true
memory_vault = "~/.local/share/april/memory"
# Explicit reminder times opt their notes into notifications; daily recaps are opt-in.
proactive_briefings = false
briefing_hour = 9

# Bounded conversational context and selected durable summaries.
conversation_history_turns = 12
conversation_context_turns = 6
conversation_idle_minutes = 30
memory_max_notes = 500
# Keep only April's private model warm briefly; Off terminates that process.
private_ollama_keep_alive_seconds = 300
