[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "april-companion"
version = "0.1.0"
description = "A local, push-to-talk dog companion"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "httpx==0.28.1", "websockets==16.0"]

[project.optional-dependencies]
speech = ["piper-tts==1.8.0"]

[project.scripts]
april = "april.server:main"

[tool.setuptools.package-data]
april = ["web/*"]

[tool.setuptools.packages.find]
include = ["april*"]
